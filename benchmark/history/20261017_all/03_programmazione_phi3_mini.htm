<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Gioco di Sudoku</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center; end;
            min-height: 100vh;
            margin: 0;
        }
        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, minmax(50px, auto));
            grid-gap: 5px;
        }
        .cell {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            width: 100%;
            height: 120px;
            background-color: #f0f0f0;
            cursor: pointer;
            user-select: none;
        }
        .cell.error {
            background-color: red;
        }
        #retry-button {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="sudoku-grid">
        <div class="cell" tabindex="0">5</div>
        <div class="cell" tabindex="0">3</div>
        <div class="cell" tabindex="0">0</div>
        <!-- ... other cells ... -->
        <div class="cell" tabindex="0">2</div>
    </div>
    <input type="text" id="userInput" style="display: none;" placeholder="Inserisci una cifra..." maxlength="1"/>
    <button id="userInputBtn" onclick="submitValue()">Inserisci</button>
    <button id="retryButton" onclick="startNewGame()">Ricomincia</button>
    <p id="errorMessage" style="color: red;"></p>

            [0, 9, 8, 0, 0, 0, 0, 6, 0],
            // ... other rows ...
            [0, 0, 0, 0, 0, 0, 2, 0, 0],
        ];

        let currentCell = { row: 0, col: 0 };

        let gameState = { solved: false };

        let userInputValue = '';

        let gameState = { solved: false };

        function submitValue() {
            if (isValidValue(sudokuGrid[currentCell.row][currentCell.col])) {
                const cells = document.querySelectorAll('.cell');
                cells.forEach(cell => cell.classList.remove('error'));
                sudokuGrid[currentCell.row][currentCell.col] = parseInt(userInputValue, 10);
                currentCell.col = (currentCell.col + 1) % 9;
                if (currentCell.col === 0) currentCell.row = (currentCell.row + 1) % 9;
                if (checkGrid()) {
                    gameState.solved = true;
                    errorMessage = '';
                } else {
                    errorMessage = 'Valore invalido. Scegli una cifra diversa.';
                    currentCell.col = (currentCell.col + 1) % 9;
                }
                updateGrid();
            }
        }

        function isValidValue(value) {
            return value >= 0 && value <= 9 && sudokuGrid[currentCell.row][currentCell.col] === 0;
        }

            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, index) => {
                const [row, col] = getCellIndex(index);
                if (sudokuGrid[row][col] !== 0) {
                    cells[index].textContent = sudokuGrid[row][col].toString();
                    cells[index].classList.remove('error');
                }
            });
        }

        function getCellIndex(cellIndex) {
            return [Math.floor(cellIndex / 9), cellIndex % 9];
        }

            currentCell = { row: 0, col: 0 };

            document.getElementById('userInput').focus();
        }

        }
