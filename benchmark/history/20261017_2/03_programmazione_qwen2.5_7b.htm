<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giochi di Sudoku</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        #sudoku {
            display: grid;
            grid-template-columns: repeat(9, 50px);
            grid-gap: 1px;
            background-color: #fff;
            border: 2px solid #000;
            padding: 10px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
        }
        .cell {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            user-select: none;
            border: 1px solid #ccc;
        }
        .cell:focus {
            outline: 2px solid #0056b3;
        }
        #controls {
            margin-top: 20px;
            text-align: center;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <div id="sudoku"></div>
    <div id="controls">
        <button onclick="restart()">Nuova partita</button>
    </div>
    <script>
        function restart() {
            document.getElementById('sudoku').innerHTML = generateBoard();
            cells = Array.from(document.getElementsByClassName('cell'));
            cells.forEach(cell => cell.addEventListener('click', selectCell));
            currentCell = null;
        }

        let currentCell = null;
        let board = [
            [5, 3, 0, 0, 7, 0, 0, 0, 0],
            [6, 0, 0, 1, 9, 5, 0, 0, 0],
            [0, 9, 8, 0, 0, 0, 0, 6, 0],
            [8, 0, 0, 0, 6, 0, 0, 0, 3],
            [4, 0, 0, 8, 0, 3, 0, 0, 1],
            [7, 0, 0, 0, 2, 0, 0, 0, 6],
            [0, 6, 0, 0, 0, 0, 2, 8, 0],
            [0, 0, 0, 4, 1, 9, 0, 0, 5],
            [0, 0, 0, 0, 8, 0, 0, 7, 9]
        ];

        function generateBoard() {
            const sudoku = document.createElement('div');
            for (let i = 0; i < 9; i++) {
                const row = document.createElement('div');
                for (let j = 0; j < 9; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.textContent = board[i][j] ? board[i][j] : '';
                    cell.onclick = () => selectCell(cell);
                    row.appendChild(cell);
                }
                sudoku.appendChild(row);
            }
            return sudoku.outerHTML;
        }

        function selectCell(cell) {
            if (currentCell) {
                currentCell.classList.remove('selected');
            }
            cell.classList.add('selected');
            currentCell = cell;
        }

        function isValidMove(row, col, num) {
            for (let i = 0; i < 9; i++) {
                if (board[row][i] === num || board[i][col] === num) {
                    return false;
                }
            }
            const startRow = row - row % 3;
            const startCol = col - col % 3;
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    if (board[i + startRow][j + startCol] === num) {
                        return false;
                    }
                }
            }
            return true;
        }

        function handleKeyPress(event) {
            if (event.key >= '1' && event.key <= '9') {
                const num = event.key;
                if (currentCell) {
                    const row = currentCell.parentElement.rowIndex - 1;
                    const col = currentCell.cellIndex;
                    if (isValidMove(row, col, num)) {
                        board[row][col] = num;
                        currentCell.textContent = num;
                        currentCell.removeEventListener('click', selectCell);
                        checkWin();
                    }
                }
            } else if (event.key === 'Backspace' || event.key === 'Delete') {
                if (currentCell) {
                    const row = currentCell.parentElement.rowIndex - 1;
                    const col = currentCell.cellIndex;
                    board[row][col] = 0;
                    currentCell.textContent = '';
                    currentCell.addEventListener('click', selectCell);
                }
            }
        }

        document.addEventListener('keydown', handleKeyPress);
        restart();
    </script>
</body>
</html>
