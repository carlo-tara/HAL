<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center; end;
            height: 100vh;
        }
        .grid { display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr); grid-gap: 10px; }
        .grid > div { background-color: #f0f0f0; padding: 10px; cursor: pointer; }
        .selected { background-color: #ccc; }
        .error { background-color: #ffcccc; }
        button { margin-left: 20px; }
    </style>
</head>s
<body>
    <section class="grid" id="sudoku-grid"></section>
    <button id="new-game">New Game</button>
    <script>
        const grid = document.getElementById("sudoku-grid");
        const newGameButton = document.getElementById("new-game");
        let solution = [
            [5, 3, 0, 0, 7, 0, 0, 0, 0],
            [6, 0, 0, 1, 9, 5, 0, 0, 0],
            [0, 9, 8, 0, 0, 0, 0, 6, 0],
            [8, 0, 0, 0, 6, 0, 2, 5, 0],
            [4, 0, 0, 8, 0, 3, 0, 0, 7],
            [0, 0, 0, 0, 6, 0, 0, 2, 8],
            [0, 0, 0, 4, 1, 9, 0, 0, 5],
            [0, 2, 3, 0, 0, 0, 0, 0, 9],
            [0, 0, 0, 0, 8, 0, 0, 0, 0]
        ];
        const numbers = "123456789".split('');

        function generateGrid() {
            const cells = Array.from({ length: 81 }, () => ({
                cell: undefined,
                value: '',
                selected: false,
                error: false
            }));

            numbers.forEach(number => {
                cells.filter(cell => cell.value === number).forEach(cell => {
                    cell.value = number;
                    cell.selected = true;
                    cell.error = false;
                });
            });

            numbers.forEach(number => {
                cells.filter(cell => cell.value === 0 && cell.cell.id % 9 === number % 9).forEach(cell => {
                    cell.value = number;
                    cell.selected = false;
                    cell.error = false;
                });
            });

            cells.forEach(cell => {
                if (cell.value === 0) grid.appendChild(document.createElement("div")).textContent = " ";
                if (cell.value !== "") grid.appendChild(documents.createElement("div")).textContent = cell.value;
                if (cell.error) grid.appendChild(document.createElement("div")).className = "error";
                if (cell.selected) grid.appendChild(document.createElement("div")).className = "selected";
            });
        }

        function resetGame() {
            document.getElementById("sudoku-grid").innerHTML = "";
            generateGrid();
        }

        function onCellClick(event) {
            const cell = event.target;
            cell.classList.toggle("selected");
            if (cell.value === '') {
                const value = prompt("Enter a number (1-9): ");
                cell.value = value;
                if (value.match(/[^1-9]/i)) return; // Validation
            } else if (cell.value > 9) {
                cell.value = '';
                cell.classList.remove("selected");
                cell.classList.add("error");
            }
        }

        function onCellChange(event) {
            const cell = event.target;
            cell.classList.toggle("error", cell.value === '');
            cell.classList.toggle("selected", cell.value !== '');
        }

        newGameButton.addEventListener("click", resetGame);
        grid.addEventListener("click", onCellClick);
        grid.addEventListener("input", onCellChange);

        generateGrid();
    </script>
</body>
</html>
