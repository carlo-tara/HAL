name: ready-for-review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    name: make ready-for-review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Platform API gate
        run: make ready-for-review
        env:
          WAIVER_FILES_GT4: "0"
